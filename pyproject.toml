[project]
name = "shutcutcli"
version = "0.1.0"
description = "ShotCut 籃球影片標記平台命令列工具"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2024.1.0",
    "cryptography>=42.0.0",
]

[project.scripts]
shutcutcli = "shutcutcli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shutcutcli"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
